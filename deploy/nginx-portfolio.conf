server {
    listen 80;
    listen [::]:80;
    server_name zulqurnainj.com www.zulqurnainj.com;

    root /var/www/zulqurnainj.com;
    index index.html;

    # certbot will add HTTPS server block + redirect here automatically

    location / {
        try_files $uri $uri.html $uri/index.html $uri/ =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|svg|webp|woff2?|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    error_page 404 /404.html;
}
