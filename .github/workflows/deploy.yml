name: Deploy to cPanel

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Download node-llama-cpp pre-built binaries
        continue-on-error: true
        timeout-minutes: 10
        run: node node_modules/node-llama-cpp/dist/cli/cli.js postinstall

      - name: Build (standalone)
        run: npm run build

      - name: Prepare deploy bundle
        env:
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          LLAMA_API_URL: ${{ secrets.LLAMA_API_URL }}
          LLAMA_API_KEY: ${{ secrets.LLAMA_API_KEY }}
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public

          mkdir -p .next/standalone/node_modules

          cp -r node_modules/node-llama-cpp .next/standalone/node_modules/

          if [ -f "node_modules/@node-llama-cpp/linux-x64/bins/linux-x64/llama-addon.node" ]; then
            mkdir -p .next/standalone/node_modules/@node-llama-cpp/linux-x64
            cp -r node_modules/@node-llama-cpp/linux-x64/bins \
                  .next/standalone/node_modules/@node-llama-cpp/linux-x64/
            echo "Copied linux-x64 llama-addon.node to standalone"
          else
            echo "llama-addon.node not found — using LLAMA_API_URL for HTTP mode"
          fi

          cp -r node_modules/offllama .next/standalone/node_modules/
          cp -r node_modules/pdf-parse .next/standalone/node_modules/
          for dep in lifecycle-utils express commander; do
            [ -d "node_modules/$dep" ] && cp -r "node_modules/$dep" .next/standalone/node_modules/
          done

          python3 - << 'PYEOF'
          import os
          cpanel_user = os.environ['CPANEL_USER']
          lines = [
            'NEXT_PUBLIC_APP_URL=https://tools.zulqurnainj.com',
            'DB_HOST=localhost',
            'DB_USER=' + cpanel_user + '_toolsu',
            'DB_PASS=' + os.environ['DB_PASS'],
            'DB_NAME=' + cpanel_user + '_toolsdb',
            'JWT_SECRET=' + os.environ['JWT_SECRET'],
            'CV_STORAGE_PATH=/home/' + cpanel_user + '/tool_cvs',
            'OFFL_LLAMA_MODEL_DIR=/home/' + cpanel_user + '/offllama_models',
          ]
          if os.environ.get('LLAMA_API_URL', '').strip():
            lines.append('LLAMA_API_URL=' + os.environ['LLAMA_API_URL'])
          if os.environ.get('LLAMA_API_KEY', '').strip():
            lines.append('LLAMA_API_KEY=' + os.environ['LLAMA_API_KEY'])
          lines += ['NODE_ENV=production', 'PORT=3000', 'HOSTNAME=0.0.0.0']
          with open('.next/standalone/.env', 'w') as f:
            f.write('\n'.join(lines) + '\n')
          print('Wrote .env with', len(lines), 'vars')
          startup = (
            '"use strict";\n'
            'const fs = require("fs");\n'
            'const path = require("path");\n'
            'const envFile = path.join(__dirname, ".env");\n'
            'if (fs.existsSync(envFile)) {\n'
            '  fs.readFileSync(envFile, "utf8").split("\\n").forEach(line => {\n'
            '    const m = line.match(/^([A-Z_][A-Z0-9_]*)=(.*)$/);\n'
            '    if (m && m[1] && !(m[1] in process.env)) process.env[m[1]] = m[2];\n'
            '  });\n'
            '}\n'
            'require("./server.js");\n'
          )
          with open('.next/standalone/startup.js', 'w') as f:
            f.write(startup)
          print('Wrote startup.js')

          # Write .htaccess for CloudLinux Passenger into the bundle
          # (uploaded via FTP — more reliable than cPanel Fileman API)
          htaccess = (
            '# DO NOT REMOVE. CLOUDLINUX PASSENGER CONFIGURATION BEGIN\n'
            'PassengerEnabled On\n'
            'PassengerBaseURI /\n'
            f'PassengerNodejs /home/{cpanel_user}/nodevenv/tools.zulqurnainj.com/22/bin/node\n'
            f'PassengerAppRoot /home/{cpanel_user}/tools.zulqurnainj.com\n'
            'PassengerAppType node\n'
            'PassengerStartupFile startup.js\n'
            '# DO NOT REMOVE. CLOUDLINUX PASSENGER CONFIGURATION END\n'
          )
          with open('.next/standalone/.htaccess', 'w') as f:
            f.write(htaccess)
          print('Wrote .htaccess')
          PYEOF

          mkdir -p .next/standalone/tmp
          date > .next/standalone/tmp/restart.txt

      - name: Install lftp
        run: sudo apt-get install -y lftp -q

      - name: Upload to server via FTP
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ${{ secrets.FTP_SERVER }}
        run: |
          lftp -c "
            set ftp:ssl-allow yes;
            set ftp:ssl-force no;
            set ssl:verify-certificate no;
            set ftp:passive-mode yes;
            set net:timeout 120;
            set net:max-retries 5;
            set net:reconnect-interval-base 5;
            set xfer:timeout 300;
            open -u \"$FTP_USER\",\"$FTP_PASS\" ftp://$FTP_HOST;
            mirror --reverse --delete --verbose \
              --exclude .git/ \
              --exclude '.next/cache/' \
              .next/standalone/ tools.zulqurnainj.com/;
            quit
          "
          echo "FTP upload complete"

      - name: Configure Passenger, write .htaccess, provision SSL
        env:
          H: ${{ secrets.CPANEL_HOST }}
          U: ${{ secrets.CPANEL_USER }}
          P: ${{ secrets.CPANEL_PASS }}
        run: |
          python3 - << 'PYEOF'
          import os, subprocess, json, urllib.parse, time

          h = os.environ['H']
          u = os.environ['U']
          p = os.environ['P']
          uapi = f"https://{h}:2083/execute"
          domain = "tools.zulqurnainj.com"
          app_name = "tools"
          app_path = f"/home/{u}/{domain}"

          def curl_get(url, timeout=30):
              out = subprocess.check_output(
                  ['curl', '-sk', '-u', f'{u}:{p}', url],
                  text=True, timeout=timeout
              )
              print(f"  GET {url.split('?')[0].split('/')[-1]}: {out[:400]}")
              return out

          def curl_post(url, data, timeout=30):
              cmd = ['curl', '-sk', '-u', f'{u}:{p}', '-X', 'POST']
              for k, v in data.items():
                  cmd += ['--data-urlencode', f'{k}={v}']
              cmd.append(url)
              out = subprocess.check_output(cmd, text=True, timeout=timeout)
              print(f"  POST {url.split('/')[-1]}: {out[:400]}")
              return out

          def ok(resp):
              try:
                  return json.loads(resp).get('status', 0) == 1
              except Exception:
                  return False

          # ── 0. Ensure subdomain exists ──
          print("\n── Subdomain ──")
          sub_params = urllib.parse.urlencode({
              "domain": "tools", "rootdomain": "zulqurnainj.com",
              "dir": domain, "disallowdot": "0",
          })
          r = curl_get(f"{uapi}/SubDomain/addsubdomain?{sub_params}")
          if ok(r):
              print("  Subdomain created — waiting 5s")
              time.sleep(5)
          else:
              print("  Subdomain already exists")

          # ── 1. Diagnose: list current Passenger apps ──
          print("\n── Current Passenger apps ──")
          r_list = curl_get(f"{uapi}/PassengerApps/list_applications")
          try:
              apps_data = json.loads(r_list)
              print("  Full response:", json.dumps(apps_data, indent=2)[:800])
          except Exception as e:
              print(f"  Could not parse: {e}")

          # ── 2. Deregister + re-register to reset host allowlist ──
          print("\n── Deregister + Register ──")
          curl_get(f"{uapi}/PassengerApps/deregister_application?name={app_name}")
          time.sleep(3)

          registered_node = None
          for node_ver in ("22", "20", "18"):
              reg_params = urllib.parse.urlencode({
                  "name": app_name, "path": app_path, "domain": domain,
                  "base_uri": "/", "startup_file": "startup.js",
                  "app_type": "node", "node_version": node_ver,
                  "deployment_mode": "production",
              })
              r_reg = curl_get(f"{uapi}/PassengerApps/register_application?{reg_params}")
              if ok(r_reg):
                  print(f"  Registered with Node.js {node_ver}")
                  registered_node = node_ver
                  break
              else:
                  print(f"  Node.js {node_ver} rejected, trying next")
          if not registered_node:
              registered_node = "22"
              print(f"  All registrations failed — defaulting to node {registered_node}")

          # ── 3. Discover the actual Node.js binary path from the registered app ──
          print("\n── Discovering Node.js binary path ──")
          nodejs_path = None
          r_list2 = curl_get(f"{uapi}/PassengerApps/list_applications")
          try:
              for app in json.loads(r_list2).get('data', {}).get('applications', []):
                  if isinstance(app, dict) and app.get('name') == app_name:
                      nodejs_path = (app.get('nodejs_path') or app.get('node_path')
                                     or app.get('nodejs_binary') or app.get('node_binary'))
                      print(f"  App record: {app}")
                      break
          except Exception as e:
              print(f"  Parse error: {e}")

          if not nodejs_path:
              # Standard cPanel nodevenv path
              nodejs_path = f"/home/{u}/nodevenv/{domain}/{registered_node}/bin/node"
              print(f"  Using standard nodevenv path: {nodejs_path}")
          else:
              print(f"  Node.js path from API: {nodejs_path}")

          # ── 4. Restart cycle ──
          print("\n── Restart ──")
          curl_get(f"{uapi}/PassengerApps/disable_application?name={app_name}")
          time.sleep(3)
          r_en = curl_get(f"{uapi}/PassengerApps/enable_application?name={app_name}")
          print("  Enable:", "OK" if ok(r_en) else "failed")
          print("  Waiting 20s for app to start...")
          time.sleep(20)

          # ── 6. Verify HTTP ──
          print("\n── HTTP check ──")
          try:
              code = subprocess.check_output(
                  ['curl', '-sk', '-o', '/dev/null', '-w', '%{http_code}',
                   '--max-time', '15', f'http://{domain}/text-to-leads'],
                  text=True, timeout=20
              )
              print(f"  http://{domain}/text-to-leads → {code}")
              if code not in ('200', '301', '302', '307', '308'):
                  print("  ✗ App not responding — check Passenger logs on server")
              else:
                  print("  ✓ App is up on HTTP")
          except Exception as e:
              print(f"  HTTP check failed: {e}")

          # ── 7. Provision SSL ──
          print("\n── SSL ──")
          ssl_params = urllib.parse.urlencode({
              "domains[0]": domain, "keytype": "prime256v1",
          })
          r_ssl = curl_get(f"{uapi}/LetsEncrypt/issue?{ssl_params}", timeout=180)
          if ok(r_ssl):
              print("  ✓ Let's Encrypt cert issued")
          else:
              print("  LetsEncrypt/issue failed — triggering AutoSSL")
              r_auto = curl_get(f"{uapi}/SSL/start_autossl_check_cpanel_domains")
              print("  AutoSSL:", r_auto[:200])

          # ── 8. Final HTTPS check ──
          print("\n── HTTPS check ──")
          time.sleep(5)
          try:
              code = subprocess.check_output(
                  ['curl', '-sk', '-o', '/dev/null', '-w', '%{http_code}',
                   '--max-time', '15', f'https://{domain}/text-to-leads'],
                  text=True, timeout=20
              )
              print(f"  https://{domain}/text-to-leads → {code}")
          except Exception as e:
              print(f"  HTTPS check: {e}")

          PYEOF
