name: Deploy to cPanel

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (standalone)
        run: npm run build

      - name: Prepare deploy bundle
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public

      - name: Install lftp
        run: sudo apt-get install -y lftp -q

      - name: Upload to server via FTP
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ${{ secrets.FTP_SERVER }}
        run: |
          lftp -c "
            set ftp:ssl-allow no;
            set net:timeout 60;
            set net:max-retries 5;
            open -u \"$FTP_USER\",\"$FTP_PASS\" ftp://$FTP_HOST;
            mirror --reverse --delete --verbose \
              --exclude .git --exclude '.next/cache' \
              .next/standalone/ tools.zulqurnainj.com/;
            quit
          "

      - name: Set env vars + restart Node.js App via cPanel API
        env:
          H: ${{ secrets.CPANEL_HOST }}
          U: ${{ secrets.CPANEL_USER }}
          P: ${{ secrets.CPANEL_PASS }}
          DB_PASS: ${{ secrets.DB_PASS }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          LLAMA_API_KEY: ${{ secrets.LLAMA_API_KEY }}
        run: |
          python3 - << 'PYEOF'
          import os, json, subprocess, urllib.parse

          h = os.environ['H']; u = os.environ['U']; p = os.environ['P']
          uapi = f"https://{h}:2083/execute"

          def curl(url):
              return subprocess.check_output(['curl','-sk','-u',f'{u}:{p}',url],text=True,timeout=20)

          env_vars = {
              "NEXT_PUBLIC_APP_URL": "https://tools.zulqurnainj.com",
              "DB_HOST": "localhost",
              "DB_USER": f"{u}_toolsu",
              "DB_PASS": os.environ['DB_PASS'],
              "DB_NAME": f"{u}_toolsdb",
              "JWT_SECRET": os.environ['JWT_SECRET'],
              "CV_STORAGE_PATH": f"/home/{u}/tool_cvs",
              "LLAMA_API_KEY": os.environ['LLAMA_API_KEY'],
              "NODE_ENV": "production",
              "PORT": "3000",
          }

          envs_param = urllib.parse.quote(json.dumps(env_vars), safe='')
          r = curl(f"{uapi}/NodeJS/update_app_env_var?app_name=tools.zulqurnainj.com&envvars={envs_param}")
          print("Env update:", r[:200])

          r = curl(f"{uapi}/NodeJS/restart_app?app_name=tools.zulqurnainj.com")
          print("Restart:", r[:200])
          PYEOF
