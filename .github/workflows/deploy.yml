name: Deploy to cPanel

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Download node-llama-cpp pre-built binaries
        run: node node_modules/node-llama-cpp/dist/cli/cli.js postinstall

      - name: Build (standalone)
        run: npm run build

      - name: Prepare deploy bundle
        env:
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          # LLAMA_API_URL is optional — if unset, offLLama runs embedded (model auto-downloads)
          LLAMA_API_URL: ${{ secrets.LLAMA_API_URL }}
          LLAMA_API_KEY: ${{ secrets.LLAMA_API_KEY }}
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public

          # Copy server-external packages into standalone so they're available at runtime.
          # node-llama-cpp uses native binaries — must be for the target OS (linux-x64 = same as runner).
          mkdir -p .next/standalone/node_modules
          cp -r node_modules/offllama .next/standalone/node_modules/
          cp -r node_modules/node-llama-cpp .next/standalone/node_modules/
          cp -r node_modules/pdf-parse .next/standalone/node_modules/
          # Copy offllama's runtime deps too
          for dep in lifecycle-utils; do
            [ -d "node_modules/$dep" ] && cp -r "node_modules/$dep" .next/standalone/node_modules/
          done

          # Write .env file (read by startup.js at runtime — never in webroot)
          python3 - << 'PYEOF'
          import os
          cpanel_user = os.environ['CPANEL_USER']
          lines = [
            f'NEXT_PUBLIC_APP_URL=https://tools.zulqurnainj.com',
            f'DB_HOST=localhost',
            f'DB_USER={cpanel_user}_toolsu',
            f'DB_PASS={os.environ["DB_PASS"]}',
            f'DB_NAME={cpanel_user}_toolsdb',
            f'JWT_SECRET={os.environ["JWT_SECRET"]}',
            f'CV_STORAGE_PATH=/home/{cpanel_user}/tool_cvs',
            # offLLama embedded mode when LLAMA_API_URL is empty
            f'OFFL_LLAMA_MODEL_DIR=/home/{cpanel_user}/offllama_models',
          ]
          # Only add LLAMA_API_URL if explicitly set (enables HTTP mode)
          if os.environ.get("LLAMA_API_URL","").strip():
            lines.append(f'LLAMA_API_URL={os.environ["LLAMA_API_URL"]}')
          if os.environ.get("LLAMA_API_KEY","").strip():
            lines.append(f'LLAMA_API_KEY={os.environ["LLAMA_API_KEY"]}')
          lines += [
            f'NODE_ENV=production',
            f'PORT=3000',
            f'HOSTNAME=0.0.0.0',
          ]
          with open('.next/standalone/.env', 'w') as f:
            f.write('\n'.join(lines) + '\n')
          print('Wrote .env with', len(lines), 'vars')
          PYEOF

          # Write startup.js — reads .env and starts server.js
          cat > .next/standalone/startup.js << 'JSEOF'
          'use strict';
          const fs = require('fs');
          const path = require('path');
          const envFile = path.join(__dirname, '.env');
          if (fs.existsSync(envFile)) {
            fs.readFileSync(envFile, 'utf8').split('\n').forEach(line => {
              const m = line.match(/^([A-Z_][A-Z0-9_]*)=(.*)$/);
              if (m && m[1] && !(m[1] in process.env)) process.env[m[1]] = m[2];
            });
          }
          require('./server.js');
          JSEOF

          # Touch tmp/restart.txt — Passenger picks this up to restart the app
          mkdir -p .next/standalone/tmp
          date > .next/standalone/tmp/restart.txt

      - name: Install lftp
        run: sudo apt-get install -y lftp -q

      - name: Upload to server via FTP
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ${{ secrets.FTP_SERVER }}
        run: |
          lftp -d -c "
            set ftp:ssl-allow yes;
            set ftp:ssl-force no;
            set ssl:verify-certificate no;
            set ftp:passive-mode yes;
            set net:timeout 120;
            set net:max-retries 5;
            set net:reconnect-interval-base 5;
            set xfer:timeout 300;
            open -u \"$FTP_USER\",\"$FTP_PASS\" ftp://$FTP_HOST;
            mirror --reverse --delete --verbose \
              --exclude .git/ --exclude '.next/cache/' \
              .next/standalone/ tools.zulqurnainj.com/;
            quit
          " 2>&1 | tail -50

      - name: Update app startup file and restart via PassengerApps API
        env:
          H: ${{ secrets.CPANEL_HOST }}
          U: ${{ secrets.CPANEL_USER }}
          P: ${{ secrets.CPANEL_PASS }}
        run: |
          python3 - << 'PYEOF'
          import os, subprocess, json, urllib.parse

          h = os.environ['H']; u = os.environ['U']; p = os.environ['P']
          uapi = f"https://{h}:2083/execute"

          def curl(url):
              return subprocess.check_output(['curl','-sk','-u',f'{u}:{p}',url],text=True,timeout=20)

          # Update app to ensure startup_file is correct
          params = urllib.parse.urlencode({
              "name": "tools",
              "startup_file": "startup.js",
              "app_type": "node",
              "node_version": "22",
              "deployment_mode": "production",
          })
          r = curl(f"{uapi}/PassengerApps/update_application?{params}")
          print("Update app:", r[:300])

          # Restart the app
          r2 = curl(f"{uapi}/PassengerApps/ensure_application_has_started?name=tools")
          print("Restart:", r2[:300])

          r3 = curl(f"{uapi}/PassengerApps/disable_application?name=tools")
          print("Disable:", r3[:200])
          import time; time.sleep(2)
          r4 = curl(f"{uapi}/PassengerApps/enable_application?name=tools")
          print("Enable:", r4[:200])
          PYEOF
