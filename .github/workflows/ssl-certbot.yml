name: SSL via Certbot (external)

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/certbot-trigger.txt'

concurrency:
  group: ssl-certbot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  certbot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install certbot
        run: sudo apt-get update -q && sudo apt-get install -y certbot

      - name: Disable Passenger, write minimal .htaccess
        env:
          H: ${{ secrets.CPANEL_HOST }}
          U: ${{ secrets.CPANEL_USER }}
          P: ${{ secrets.CPANEL_PASS }}
        run: |
          python3 << 'PYEOF'
          import os, subprocess, json, time
          h, u, p = os.environ['H'], os.environ['U'], os.environ['P']
          uapi = f"https://{h}:2083/execute"
          domain = "tools.zulqurnainj.com"
          app_path = f"/home/{u}/{domain}"

          def cget(url):
              return subprocess.check_output(['curl','-sk','-u',f'{u}:{p}',url], text=True, timeout=60)
          def cpost(url, data):
              cmd = ['curl','-sk','-u',f'{u}:{p}','-X','POST']
              for k,v in data.items(): cmd += ['--data-urlencode', f'{k}={v}']
              cmd.append(url)
              return subprocess.check_output(cmd, text=True, timeout=60)

          # Disable Passenger and switch to plain static serving
          print("disable:", cget(f"{uapi}/PassengerApps/disable_application?name=tools"))
          time.sleep(2)
          # Allow .well-known to bypass any rewrites
          ht = ("Options -Indexes\n"
                "<IfModule mod_rewrite.c>\n"
                "  RewriteEngine On\n"
                "  RewriteRule ^\\.well-known/acme-challenge/.* - [L]\n"
                "</IfModule>\n")
          print("htaccess:", cpost(f"{uapi}/Fileman/save_file_content",
                {"dir": app_path, "file": ".htaccess", "content": ht}))
          # Ensure .well-known/acme-challenge exists
          cpost(f"{uapi}/Fileman/mkdir", {"path": app_path + "/.well-known", "name": "acme-challenge"})
          # Place a probe file
          cpost(f"{uapi}/Fileman/save_file_content",
                {"dir": app_path + "/.well-known/acme-challenge", "file": "probe.txt", "content": "ok"})
          time.sleep(3)
          # Verify probe is served
          r = subprocess.check_output(
              ['curl','-s','-o','-','-w','\\n@@CODE=%{http_code}','--max-time','15',
               f'http://{domain}/.well-known/acme-challenge/probe.txt'],
              text=True, timeout=20
          )
          print("probe check:", r[:200])
          PYEOF

      - name: Write certbot hook scripts
        env:
          H: ${{ secrets.CPANEL_HOST }}
          U: ${{ secrets.CPANEL_USER }}
          P: ${{ secrets.CPANEL_PASS }}
        run: |
          mkdir -p /tmp/cb
          cat > /tmp/cb/auth.sh << 'EOF'
          #!/bin/bash
          set -e
          # CERTBOT_DOMAIN, CERTBOT_VALIDATION, CERTBOT_TOKEN are env vars from certbot
          DOMAIN="tools.zulqurnainj.com"
          APP_PATH="/home/${U}/${DOMAIN}"
          UAPI="https://${H}:2083/execute"
          echo "Auth: uploading ${CERTBOT_TOKEN} = ${CERTBOT_VALIDATION}"
          curl -sk -u "${U}:${P}" -X POST \
            --data-urlencode "dir=${APP_PATH}/.well-known/acme-challenge" \
            --data-urlencode "file=${CERTBOT_TOKEN}" \
            --data-urlencode "content=${CERTBOT_VALIDATION}" \
            "${UAPI}/Fileman/save_file_content" | head -c 300
          echo ""
          # Verify it's served
          sleep 3
          curl -s -o /dev/null -w "probe code=%{http_code}\n" --max-time 15 \
            "http://${DOMAIN}/.well-known/acme-challenge/${CERTBOT_TOKEN}"
          EOF
          chmod +x /tmp/cb/auth.sh

          cat > /tmp/cb/cleanup.sh << 'EOF'
          #!/bin/bash
          DOMAIN="tools.zulqurnainj.com"
          APP_PATH="/home/${U}/${DOMAIN}"
          UAPI="https://${H}:2083/execute"
          curl -sk -u "${U}:${P}" -X POST \
            --data-urlencode "dir=${APP_PATH}/.well-known/acme-challenge" \
            --data-urlencode "files=${CERTBOT_TOKEN}" \
            "${UAPI}/Fileman/remove_files" | head -c 200 || true
          EOF
          chmod +x /tmp/cb/cleanup.sh

      - name: Run certbot
        env:
          H: ${{ secrets.CPANEL_HOST }}
          U: ${{ secrets.CPANEL_USER }}
          P: ${{ secrets.CPANEL_PASS }}
        run: |
          sudo H=$H U=$U P=$P certbot certonly \
            --manual \
            --preferred-challenges http \
            --manual-auth-hook /tmp/cb/auth.sh \
            --manual-cleanup-hook /tmp/cb/cleanup.sh \
            --non-interactive \
            --agree-tos \
            --register-unsafely-without-email \
            -d tools.zulqurnainj.com 2>&1 | tee /tmp/certbot.log
          sudo ls -la /etc/letsencrypt/live/tools.zulqurnainj.com/

      - name: Install cert via cPanel UAPI
        env:
          H: ${{ secrets.CPANEL_HOST }}
          U: ${{ secrets.CPANEL_USER }}
          P: ${{ secrets.CPANEL_PASS }}
        run: |
          sudo chmod -R a+r /etc/letsencrypt/live/tools.zulqurnainj.com/ /etc/letsencrypt/archive/
          python3 << 'PYEOF'
          import os, subprocess, json
          h, u, p = os.environ['H'], os.environ['U'], os.environ['P']
          uapi = f"https://{h}:2083/execute"
          domain = "tools.zulqurnainj.com"

          live = f"/etc/letsencrypt/live/{domain}"
          cert = open(f"{live}/cert.pem").read()
          key = open(f"{live}/privkey.pem").read()
          cab = open(f"{live}/chain.pem").read()
          fullchain = open(f"{live}/fullchain.pem").read()
          print(f"cert={len(cert)} key={len(key)} chain={len(cab)} fullchain={len(fullchain)}")

          cmd = ['curl','-sk','-u',f'{u}:{p}','-X','POST',
                 '--data-urlencode', f'domain={domain}',
                 '--data-urlencode', f'cert={cert}',
                 '--data-urlencode', f'key={key}',
                 '--data-urlencode', f'cabundle={cab}',
                 f"{uapi}/SSL/install_ssl"]
          r = subprocess.check_output(cmd, text=True, timeout=120)
          print("install_ssl response:")
          print(r[:2000])
          PYEOF

      - name: Restore Passenger and verify
        env:
          H: ${{ secrets.CPANEL_HOST }}
          U: ${{ secrets.CPANEL_USER }}
          P: ${{ secrets.CPANEL_PASS }}
        run: |
          python3 << 'PYEOF'
          import os, subprocess, json, time, datetime
          h, u, p = os.environ['H'], os.environ['U'], os.environ['P']
          uapi = f"https://{h}:2083/execute"
          domain = "tools.zulqurnainj.com"
          app_path = f"/home/{u}/{domain}"
          NODEJS_BIN = "/opt/alt/alt-nodejs22/root/usr/bin/node"

          out = []
          def log(s): out.append(s); print(s)

          def cget(url):
              return subprocess.check_output(['curl','-sk','-u',f'{u}:{p}',url], text=True, timeout=60)
          def cpost(url, data):
              cmd = ['curl','-sk','-u',f'{u}:{p}','-X','POST']
              for k,v in data.items(): cmd += ['--data-urlencode', f'{k}={v}']
              cmd.append(url)
              return subprocess.check_output(cmd, text=True, timeout=60)

          log(f"# SSL Certbot Install — {datetime.datetime.utcnow().isoformat()}Z")

          htaccess = (
              "# DO NOT REMOVE. CLOUDLINUX PASSENGER CONFIGURATION BEGIN\n"
              "PassengerEnabled On\n"
              "PassengerBaseURI /\n"
              f"PassengerNodejs {NODEJS_BIN}\n"
              f"PassengerAppRoot {app_path}\n"
              "PassengerAppType node\n"
              "PassengerStartupFile startup.js\n"
              "# DO NOT REMOVE. CLOUDLINUX PASSENGER CONFIGURATION END\n"
          )
          log("restore .htaccess: " + cpost(f"{uapi}/Fileman/save_file_content",
              {"dir": app_path, "file": ".htaccess", "content": htaccess})[:200])
          log("enable: " + cget(f"{uapi}/PassengerApps/enable_application?name=tools")[:200])
          cpost(f"{uapi}/Fileman/save_file_content",
                {"dir": app_path + "/tmp", "file": "restart.txt", "content": str(time.time())})
          time.sleep(25)

          # Verify cert
          log("\n## Final TLS cert")
          import ssl, socket
          try:
              ctx = ssl.create_default_context()
              ctx.check_hostname = False
              ctx.verify_mode = ssl.CERT_NONE
              with socket.create_connection((domain, 443), timeout=10) as sock:
                  with ctx.wrap_socket(sock, server_hostname=domain) as ssock:
                      der = ssock.getpeercert(binary_form=True)
                      p2 = subprocess.run(['openssl','x509','-inform','DER','-noout','-subject','-issuer','-dates'],
                                       input=der, capture_output=True, timeout=10)
                      log(p2.stdout.decode())
          except Exception as e:
              log(f"err: {e}")

          # Final checks with cert verification ON
          log("\n## Final HTTP/HTTPS checks (with cert verify)")
          for scheme in ('http', 'https'):
              for verify in ('-s', '-sk'):
                  try:
                      code = subprocess.check_output(
                          ['curl', verify, '-o', '/dev/null', '-w', '%{http_code}',
                           '--max-time', '20', f'{scheme}://{domain}/text-to-leads'],
                          text=True, timeout=25
                      )
                      log(f"  {scheme} ({'verify' if verify=='-s' else 'insecure'}): code={code}")
                  except subprocess.CalledProcessError as e:
                      log(f"  {scheme} ({'verify' if verify=='-s' else 'insecure'}): err={e.returncode}")

          os.makedirs('.diag', exist_ok=True)
          content = '\n'.join(out)
          open('.diag/ssl-status.md', 'w').write(content)
          stamp = datetime.datetime.utcnow().strftime('%Y%m%d-%H%M%S')
          open(f'.diag/{stamp}-certbot.md', 'w').write(content)
          PYEOF

          git config user.email "ssl-certbot@github-actions"
          git config user.name "ssl-certbot"
          git add .diag/
          git commit -m "ssl-certbot [skip ci]: $(date -u +%Y%m%d-%H%M%S)" || echo "nothing to commit"
          git push origin master 2>&1 | tail -5 || echo "push failed"
