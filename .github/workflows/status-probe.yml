name: Status Probe

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/probe-trigger.txt'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Probe HTTP/HTTPS and TLS cert
        run: |
          python3 << 'PYEOF'
          import subprocess, datetime, os

          domain = "tools.zulqurnainj.com"
          out = []
          def log(s): out.append(s); print(s)

          log(f"# Status probe — {datetime.datetime.utcnow().isoformat()}Z")
          log(f"- run: https://github.com/Zulqurnain/text-to-leads-extractor/actions/runs/{os.environ.get('GITHUB_RUN_ID','?')}")

          for scheme in ('http', 'https'):
              try:
                  r = subprocess.check_output(
                      ['curl', '-sk', '-i', '-o', '-', '-w', '\n@@CODE=%{http_code}',
                       '--max-time', '20', f'{scheme}://{domain}/text-to-leads'],
                      text=True, timeout=25
                  )
                  code = next((l.split('=')[1].strip() for l in r.split('\n') if l.startswith('@@CODE=')), '?')
                  first = r.split('\n')[0].strip()
                  log(f"\n## {scheme.upper()}")
                  log(f"code={code}  first_line={first}")
                  log("```")
                  log(r[:1200])
                  log("```")
              except Exception as e:
                  log(f"\n## {scheme.upper()}")
                  log(f"ERROR: {e}")

          # TLS cert check
          log("\n## TLS cert")
          log("```")
          try:
              cert = subprocess.check_output(
                  ['curl', '-sv', '--max-time', '10', f'https://{domain}/'],
                  stderr=subprocess.STDOUT, text=True, timeout=15
              )
              for line in cert.split('\n'):
                  if any(k in line for k in ('subject', 'issuer', 'expire', 'SSL', 'TLS', 'CN =', 'SAN', 'certificate')):
                      log(line.rstrip())
          except Exception as e:
              log(f"cert check error: {e}")
          log("```")

          content = '\n'.join(out)
          import os
          os.makedirs('.diag', exist_ok=True)
          open('.diag/status.md', 'w').write(content)
          print(f"\nWrote .diag/status.md ({len(content)} chars)")
          PYEOF

      - name: Commit status
        run: |
          git config user.email "probe@github-actions"
          git config user.name "status-probe"
          git add .diag/status.md
          git commit -m "probe [skip ci]: status @ $(date -u +%Y%m%d-%H%M%S)" || echo "nothing to commit"
          git push origin master 2>&1 | tail -5 || echo "push failed"
