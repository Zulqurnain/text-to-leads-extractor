name: Contabo API Probe

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/contabo-probe-trigger.txt'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CL_ID:   ${{ secrets.CONTABO_CLIENT_ID }}
      CL_SEC:  ${{ secrets.CONTABO_CLIENT_SECRET }}
      CONT_U:  ${{ secrets.CONTABO_USER }}
      CONT_P:  ${{ secrets.CONTABO_PASS }}
      VPS_H:   ${{ secrets.VPS_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: Probe Contabo API
        run: |
          mkdir -p .diag
          REPORT=.diag/contabo-probe.md
          uuid() { python3 -c 'import uuid; print(uuid.uuid4())'; }
          {
            echo "# Contabo API Probe — $(date -u +%FT%TZ)"
            echo ""
            echo "## Step 1: Get OAuth token"
            TOK_JSON=$(curl -sS -X POST \
              "https://auth.contabo.com/auth/realms/contabo/protocol/openid-connect/token" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              --data-urlencode "client_id=$CL_ID" \
              --data-urlencode "client_secret=$CL_SEC" \
              --data-urlencode "username=$CONT_U" \
              --data-urlencode "password=$CONT_P" \
              --data-urlencode "grant_type=password")
            TOKEN=$(echo "$TOK_JSON" | python3 -c "import sys,json; print(json.loads(sys.stdin.read()).get('access_token',''))" 2>/dev/null)
            echo '```'
            echo "token_len=${#TOKEN}"
            echo '```'

            if [ -z "$TOKEN" ]; then
              echo "❌ NO TOKEN"
              echo '```'; echo "$TOK_JSON"; echo '```'
              exit 0
            fi

            echo ""
            echo "## Step 2: List instances"
            echo '```'
            INST=$(curl -sS -H "Authorization: Bearer $TOKEN" -H "x-request-id: $(uuid)" \
              "https://api.contabo.com/v1/compute/instances?size=20")
            echo "$INST" | python3 -m json.tool 2>&1 | head -200
            echo '```'

            echo ""
            echo "## Step 3: Find instance for $VPS_H"
            echo '```'
            echo "$INST" | python3 -c "
            import sys, json, os
            d = json.loads(sys.stdin.read())
            target = os.environ['VPS_H']
            for i in d.get('data', []):
                ip4 = (i.get('ipConfig', {}) or {}).get('v4', {}).get('ip') or i.get('ipv4', '')
                print(f\"  id={i.get('instanceId')} ip={ip4} status={i.get('status')} image={i.get('imageId')}\")
                if ip4 == target:
                    print('  → MATCH')
                    print(json.dumps(i, indent=2))
            "
            echo '```'

            echo ""
            echo "## Step 4: List images (Ubuntu only)"
            echo '```'
            curl -sS -H "Authorization: Bearer $TOKEN" -H "x-request-id: $(uuid)" \
              "https://api.contabo.com/v1/compute/images?size=50" \
              | python3 -c "
            import sys, json
            d = json.loads(sys.stdin.read())
            for img in d.get('data', []):
                name = img.get('name','')
                if 'ubuntu' in name.lower() or 'Ubuntu' in name:
                    print(f\"  {img.get('imageId')}: {name} ({img.get('osType')})\")
            "
            echo '```'

            echo ""
            echo "## Step 5: List existing secrets"
            echo '```'
            curl -sS -H "Authorization: Bearer $TOKEN" -H "x-request-id: $(uuid)" \
              "https://api.contabo.com/v1/secrets?size=20" \
              | python3 -c "
            import sys, json
            d = json.loads(sys.stdin.read())
            for s in d.get('data', []):
                print(f\"  id={s.get('secretId')} type={s.get('type')} name={s.get('name')}\")
            "
            echo '```'
          } | tee $REPORT

          git config user.email "contabo-probe@github-actions"
          git config user.name "contabo-probe"
          git add .diag/contabo-probe.md
          git -c gpg.format=ssh -c commit.gpgsign=false commit \
            -m "contabo-probe [skip ci]: $(date -u +%Y%m%d-%H%M%S)" || echo "nothing to commit"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git master 2>&1 | tail -3
