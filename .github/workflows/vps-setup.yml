name: VPS Setup

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/vps-setup-trigger.txt'

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      H:       ${{ secrets.VPS_HOST }}
      U:       ${{ secrets.VPS_USER }}
      DB_PASS: ${{ secrets.DB_PASS }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$H" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Install system packages
        run: |
          ssh -i ~/.ssh/id_ed25519 "$U@$H" "
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -q
            apt-get install -y -q nginx mysql-server certbot python3-certbot-nginx ufw fail2ban curl git rsync jq
            # Node 22 via NodeSource
            if ! command -v node >/dev/null || ! node -v | grep -q '^v22'; then
              curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
              apt-get install -y -q nodejs
            fi
            # PM2
            npm install -g pm2 || true
            pm2 startup systemd -u root --hp /root || true
            # Systemd enable
            systemctl enable --now nginx mysql fail2ban
          "

      - name: Configure firewall
        run: |
          ssh -i ~/.ssh/id_ed25519 "$U@$H" "
            ufw --force reset
            ufw default deny incoming
            ufw default allow outgoing
            ufw allow 22/tcp
            ufw allow 80/tcp
            ufw allow 443/tcp
            ufw --force enable
            ufw status
          "

      - name: Create MySQL database + user
        run: |
          ssh -i ~/.ssh/id_ed25519 "$U@$H" "
            mysql -e \"CREATE DATABASE IF NOT EXISTS tools_db CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;\"
            mysql -e \"CREATE USER IF NOT EXISTS 'tools_user'@'localhost' IDENTIFIED BY '$DB_PASS';\"
            mysql -e \"ALTER USER 'tools_user'@'localhost' IDENTIFIED BY '$DB_PASS';\"
            mysql -e \"GRANT ALL PRIVILEGES ON tools_db.* TO 'tools_user'@'localhost'; FLUSH PRIVILEGES;\"
            mysql tools_db -e 'SHOW TABLES;'
          "

      - name: Apply DB schema
        run: |
          scp -i ~/.ssh/id_ed25519 supabase/schema.sql "$U@$H:/tmp/schema.sql"
          ssh -i ~/.ssh/id_ed25519 "$U@$H" "mysql tools_db < /tmp/schema.sql && rm /tmp/schema.sql && mysql tools_db -e 'SHOW TABLES;'"

      - name: Create app directories
        run: |
          ssh -i ~/.ssh/id_ed25519 "$U@$H" "
            mkdir -p /var/www/zulqurnainj.com /var/www/tools.zulqurnainj.com /var/cv_storage
            chmod 700 /var/cv_storage
            chown -R www-data:www-data /var/www
          "

      - name: Deploy nginx vhost configs (HTTP only — certbot will add HTTPS)
        run: |
          scp -i ~/.ssh/id_ed25519 deploy/nginx-portfolio.conf "$U@$H:/etc/nginx/sites-available/zulqurnainj.com"
          scp -i ~/.ssh/id_ed25519 deploy/nginx-tools.conf     "$U@$H:/etc/nginx/sites-available/tools.zulqurnainj.com"
          ssh -i ~/.ssh/id_ed25519 "$U@$H" "
            ln -sf /etc/nginx/sites-available/zulqurnainj.com         /etc/nginx/sites-enabled/zulqurnainj.com
            ln -sf /etc/nginx/sites-available/tools.zulqurnainj.com   /etc/nginx/sites-enabled/tools.zulqurnainj.com
            rm -f /etc/nginx/sites-enabled/default
            nginx -t && systemctl reload nginx
          "

      - name: Report setup state
        run: |
          mkdir -p .diag
          {
            echo "# VPS Setup — $(date -u +%FT%TZ)"
            echo ""
            ssh -i ~/.ssh/id_ed25519 "$U@$H" "
              echo '## Versions'
              node -v; npm -v; pm2 -v; nginx -v 2>&1; mysql --version; certbot --version
              echo ''
              echo '## Services'
              systemctl is-active nginx mysql fail2ban
              echo ''
              echo '## Nginx vhosts'
              ls /etc/nginx/sites-enabled/
              echo ''
              echo '## DB tables'
              mysql tools_db -e 'SHOW TABLES;'
              echo ''
              echo '## Firewall'
              ufw status numbered
            "
          } > .diag/vps-setup.md

          git config user.email "vps-setup@github-actions"
          git config user.name "vps-setup"
          git add .diag/vps-setup.md
          git -c gpg.format=ssh -c commit.gpgsign=false \
            -m "vps-setup [skip ci]: $(date -u +%Y%m%d-%H%M%S)" || echo "nothing to commit"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git master 2>&1 | tail -3 || true
