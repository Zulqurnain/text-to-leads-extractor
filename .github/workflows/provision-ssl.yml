name: Provision SSL for tools.zulqurnainj.com

on:
  workflow_dispatch:

jobs:
  ssl:
    runs-on: ubuntu-latest
    steps:
      - name: Issue Let's Encrypt cert via cPanel UAPI
        env:
          H: ${{ secrets.CPANEL_HOST }}
          U: ${{ secrets.CPANEL_USER }}
          P: ${{ secrets.CPANEL_PASS }}
        run: |
          python3 - << 'PYEOF'
          import os, subprocess, json, urllib.parse, time

          h = os.environ['H']
          u = os.environ['U']
          p = os.environ['P']
          uapi = f"https://{h}:2083/execute"
          domain = "tools.zulqurnainj.com"

          def curl(url, timeout=120):
              out = subprocess.check_output(
                  ['curl', '-sk', '-u', f'{u}:{p}', url],
                  text=True, timeout=timeout
              )
              print(f"  → {out[:400]}")
              return out

          def uapi_ok(resp):
              try:
                  return json.loads(resp).get('status', 0) == 1
              except Exception:
                  return False

          # Ensure app is running so ACME HTTP challenge can respond
          print(f"\n── Ensuring Passenger app is enabled ──")
          curl(f"{uapi}/PassengerApps/enable_application?name=tools")
          time.sleep(5)

          # Try Let's Encrypt
          print(f"\n── Requesting Let's Encrypt cert for {domain} ──")
          ssl_params = urllib.parse.urlencode({
              "domains[0]": domain,
              "keytype":    "prime256v1",
          })
          r = curl(f"{uapi}/LetsEncrypt/issue?{ssl_params}", timeout=180)
          if uapi_ok(r):
              print("  ✓ SSL cert issued OK")
          else:
              print("  LetsEncrypt/issue failed — triggering AutoSSL")
              r2 = curl(f"{uapi}/SSL/start_autossl_check_cpanel_domains")
              print("  AutoSSL triggered:", r2[:200])
              print("  Note: AutoSSL may take up to 1 hour to complete")

          # Verify
          print(f"\n── Verifying HTTPS ──")
          time.sleep(10)
          code = subprocess.check_output(
              ['curl', '-sk', '-o', '/dev/null', '-w', '%{http_code}',
               '--max-time', '15', f'https://{domain}/text-to-leads'],
              text=True, timeout=20
          )
          print(f"  https://{domain}/text-to-leads → HTTP {code}")
          if code in ('200', '301', '302', '307', '308'):
              print("  ✓ HTTPS is working")
          else:
              print("  ✗ HTTPS not yet available — AutoSSL may still be running")
          PYEOF
