name: Tools Doctor — diagnose tools.zulqurnainj.com

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'diagnose | fix-passenger | fix-ssl | restart-only'
        default: 'fix-passenger'
        required: true
  push:
    branches: [master]
    paths:
      - '.github/workflows/tools-doctor.yml'
      - '.github/doctor-trigger.txt'

concurrency:
  group: tools-doctor
  cancel-in-progress: true

jobs:
  doctor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: External probes from runner
        run: |
          set +e
          MODE="${{ inputs.mode || 'fix-passenger' }}"
          {
            echo "=== Mode: $MODE  |  $(date -u) ==="
            echo "--- DNS ---"; getent ahosts tools.zulqurnainj.com; getent ahosts zulqurnainj.com
            echo "--- HTTP /text-to-leads ---"
            curl -sk -i --max-time 15 http://tools.zulqurnainj.com/text-to-leads 2>&1 | head -25
            echo "--- HTTPS /text-to-leads ---"
            curl -sk -i --max-time 15 https://tools.zulqurnainj.com/text-to-leads 2>&1 | head -25
            echo "--- TLS cert ---"
            echo | openssl s_client -connect tools.zulqurnainj.com:443 -servername tools.zulqurnainj.com 2>/dev/null | openssl x509 -noout -subject -issuer -dates -ext subjectAltName 2>&1
            echo "--- ACME path ---"
            curl -sk -i --max-time 10 http://tools.zulqurnainj.com/.well-known/acme-challenge/preflight 2>&1 | head -10
            echo "--- Portfolio HTTPS ---"
            curl -sk -o /dev/null -w 'HTTPS zulqurnainj.com: %{http_code}\n' --max-time 15 https://zulqurnainj.com/
            curl -sk -o /dev/null -w 'HTTPS /saas/: %{http_code}\n' --max-time 15 https://zulqurnainj.com/saas/
          } | tee /tmp/probe.txt

      - name: Install sshpass
        run: sudo apt-get update -q && sudo apt-get install -y sshpass

      - name: SSH diagnose / fix (collects /tmp/diag.txt on runner)
        env:
          MODE: ${{ inputs.mode || 'fix-passenger' }}
          SSH_HOST: ${{ secrets.FTP_SERVER }}
          SSH_USER: ${{ secrets.FTP_USERNAME }}
          SSH_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          set +e
          SSH="sshpass -p $SSH_PASS ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p YOUR_SFTP_PORT $SSH_USER@$SSH_HOST"
          SCP="sshpass -p $SSH_PASS scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -P YOUR_SFTP_PORT"

          # Build remote script
          cat > /tmp/remote.sh <<REMOTE_SCRIPT
          set +e
          MODE="${MODE}"
          APPDIR=\$HOME/tools.zulqurnainj.com
          DIAG=/tmp/diag.txt
          : > "\$DIAG"
          {
            echo "=== SERVER DIAG (\$(date -u))  mode=\$MODE ==="
            whoami; hostname; pwd; echo "HOME=\$HOME"
            echo "--- \$APPDIR listing ---"
            ls -la "\$APPDIR/" 2>&1 | head -40
            echo "--- .htaccess ---"
            cat "\$APPDIR/.htaccess" 2>&1 || echo "no .htaccess"
            echo "--- startup.js first 30 ---"
            head -30 "\$APPDIR/startup.js" 2>&1 || echo "missing"
            echo "--- server.js ---"
            ls -la "\$APPDIR/server.js" 2>&1
            echo "--- .env sanitized ---"
            grep -vi 'PASS\|SECRET\|KEY' "\$APPDIR/.env" 2>&1 | head -30
            echo "--- nodevenv dirs ---"
            ls -la \$HOME/nodevenv/ 2>&1 | head
            ls -la \$HOME/nodevenv/tools.zulqurnainj.com/ 2>&1 | head
            for v in 18 20 22 24; do
              NB=\$HOME/nodevenv/tools.zulqurnainj.com/\$v/bin/node
              [ -x "\$NB" ] && echo "  OK node \$v: \$NB" || echo "  -- node \$v: missing"
            done
            echo "--- Passenger UAPI list_applications ---"
            uapi PassengerApps list_applications 2>&1 | head -80
            echo "--- Server-local HTTP self-check ---"
            curl -sk -i --max-time 10 -H 'Host: tools.zulqurnainj.com' http://127.0.0.1/text-to-leads 2>&1 | head -20
            echo "--- Server-side public HTTP ---"
            curl -sk -i --max-time 10 http://tools.zulqurnainj.com/text-to-leads 2>&1 | head -20
            echo "--- Error logs ---"
            for L in \$HOME/logs/tools.zulqurnainj.com.error.log \$HOME/logs/error_log \$HOME/error_log; do
              [ -r "\$L" ] && { echo "=== \$L ==="; tail -30 "\$L"; }
            done
            echo "--- Passenger logs ---"
            for L in \$HOME/logs/passenger.log \$HOME/.passenger/passenger.log; do
              [ -r "\$L" ] && { echo "=== \$L ==="; tail -30 "\$L"; }
            done
          } >> "\$DIAG" 2>&1

          NB=""; NV=""
          for v in 22 20 18 24; do
            if [ -x \$HOME/nodevenv/tools.zulqurnainj.com/\$v/bin/node ]; then
              NB=\$HOME/nodevenv/tools.zulqurnainj.com/\$v/bin/node
              NV=\$v
              break
            fi
          done

          if [ "\$MODE" = "fix-passenger" ] || [ "\$MODE" = "fix-ssl" ]; then
            {
              echo
              echo "=== APPLYING FIX (mode=\$MODE) ==="
              if [ -n "\$NB" ]; then echo "using node \$NV: \$NB"; else echo "no nodevenv; registering"; fi
            } >> "\$DIAG"
            if [ -z "\$NB" ]; then
              uapi PassengerApps register_application name=tools path=\$APPDIR domain=tools.zulqurnainj.com base_uri=/ startup_file=startup.js app_type=node node_version=22 deployment_mode=production >> "\$DIAG" 2>&1
              sleep 8
              for v in 22 20 18; do
                if [ -x \$HOME/nodevenv/tools.zulqurnainj.com/\$v/bin/node ]; then
                  NB=\$HOME/nodevenv/tools.zulqurnainj.com/\$v/bin/node
                  NV=\$v
                  echo "have node \$v now" >> "\$DIAG"
                  break
                fi
              done
            fi
          fi

          if [ "\$MODE" = "fix-ssl" ]; then
            {
              echo
              echo "=== SSL FIX ==="
              cp "\$APPDIR/.htaccess" "\$APPDIR/.htaccess.bak.\$(date +%s)" 2>/dev/null
              printf 'Options -Indexes\n' > "\$APPDIR/.htaccess"
              mkdir -p "\$APPDIR/.well-known/acme-challenge/"
              echo PROBE > "\$APPDIR/.well-known/acme-challenge/probe"
              echo "--- ACME probe ---"
              curl -sv --max-time 8 http://tools.zulqurnainj.com/.well-known/acme-challenge/probe 2>&1 | head -10
              rm -f "\$APPDIR/.well-known/acme-challenge/probe"
              uapi HTTP disable_force_https domain=tools.zulqurnainj.com 2>&1 | head -10
              uapi HTTP update_always_redirect domain=tools.zulqurnainj.com redirect_to_ssl=0 2>&1 | head -10
              echo "--- AutoSSL ---"
              uapi SSL start_autossl_check_cpanel_domains 2>&1 | head -20
              echo "--- LetsEncrypt install_ssl ---"
              uapi LetsEncrypt install_ssl domains='[{"domain":"tools.zulqurnainj.com","wildcard":false}]' 2>&1 | head -40
            } >> "\$DIAG" 2>&1
          fi

          if [ "\$MODE" = "fix-passenger" ] && [ -n "\$NB" ]; then
            HT="\$APPDIR/.htaccess"
            printf '# DO NOT REMOVE. CLOUDLINUX PASSENGER CONFIGURATION BEGIN\n' >  "\$HT"
            printf 'PassengerEnabled On\n'                                          >> "\$HT"
            printf 'PassengerBaseURI /\n'                                           >> "\$HT"
            printf 'PassengerNodejs %s\n' "\$NB"                                    >> "\$HT"
            printf 'PassengerAppRoot %s\n' "\$APPDIR"                               >> "\$HT"
            printf 'PassengerAppType node\n'                                        >> "\$HT"
            printf 'PassengerStartupFile startup.js\n'                              >> "\$HT"
            printf '# DO NOT REMOVE. CLOUDLINUX PASSENGER CONFIGURATION END\n'      >> "\$HT"
            {
              echo
              echo "=== PASSENGER FIX ==="
              echo "Wrote .htaccess:"
              cat "\$HT"
              mkdir -p "\$APPDIR/tmp"; date > "\$APPDIR/tmp/restart.txt"
              uapi PassengerApps disable_application name=tools 2>&1 | head -5
              sleep 3
              uapi PassengerApps enable_application name=tools 2>&1 | head -5
              sleep 15
              echo "--- Post-restart self-check ---"
              curl -sk -i --max-time 10 http://tools.zulqurnainj.com/text-to-leads 2>&1 | head -15
            } >> "\$DIAG" 2>&1
          fi

          if [ "\$MODE" = "restart-only" ]; then
            {
              echo
              echo "=== RESTART ONLY ==="
              mkdir -p "\$APPDIR/tmp"; date > "\$APPDIR/tmp/restart.txt"
              uapi PassengerApps disable_application name=tools 2>&1 | head -5
              sleep 3
              uapi PassengerApps enable_application name=tools 2>&1 | head -5
              sleep 15
              curl -sk -i --max-time 10 http://tools.zulqurnainj.com/text-to-leads 2>&1 | head -15
            } >> "\$DIAG" 2>&1
          fi
          echo "=== END DIAG \$(date -u) ===" >> "\$DIAG"
          REMOTE_SCRIPT

          # Run remote script and download result
          echo "--- Uploading remote.sh to server ---"
          $SCP /tmp/remote.sh "$SSH_USER@$SSH_HOST:/tmp/remote.sh" 2>&1 | tail -5
          echo "--- Running remote.sh ---"
          $SSH "bash /tmp/remote.sh" 2>&1 | tail -30
          echo "--- Downloading /tmp/diag.txt ---"
          $SCP "$SSH_USER@$SSH_HOST:/tmp/diag.txt" /tmp/diag.txt 2>&1 | tail -5
          echo "--- diag.txt size on runner ---"
          ls -la /tmp/diag.txt
          wc -l /tmp/diag.txt

      - name: Commit diagnostic to repo
        if: always()
        env:
          MODE: ${{ inputs.mode || 'fix-passenger' }}
        run: |
          set +e
          mkdir -p .diag
          STAMP=$(date -u +%Y%m%d-%H%M%S)
          OUT=".diag/${STAMP}-${MODE}.md"
          {
            echo "# tools-doctor diagnostic"
            echo
            echo "- timestamp: $(date -u)"
            echo "- mode: $MODE"
            echo "- commit: $GITHUB_SHA"
            echo "- run: https://github.com/Zulqurnain/text-to-leads-extractor/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "## External probe (from runner)"
            echo
            echo '```'
            cat /tmp/probe.txt 2>/dev/null || echo "no probe output"
            echo '```'
            echo
            echo "## Server diagnostic (SSH)"
            echo
            echo '```'
            cat /tmp/diag.txt 2>/dev/null || echo "no server diag (SSH likely failed)"
            echo '```'
          } > "$OUT"
          cp "$OUT" .diag/latest.md
          git config user.email "tools-doctor@github-actions"
          git config user.name "tools-doctor"
          git add .diag/
          git commit -m "diag [skip ci]: ${MODE} @ ${STAMP}" || echo "nothing to commit"
          git push origin master || echo "push failed"
          echo "--- preview of $OUT ---"
          head -50 "$OUT"
