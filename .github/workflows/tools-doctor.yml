name: Tools Doctor v5 — try system node paths

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'try-paths | restart-test'
        default: 'try-paths'
        required: true
  push:
    branches: [master]
    paths:
      - '.github/workflows/tools-doctor.yml'
      - '.github/doctor-trigger.txt'

concurrency:
  group: tools-doctor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Doctor v5
        env:
          MODE: ${{ inputs.mode || 'try-paths' }}
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_PASS: ${{ secrets.CPANEL_PASS }}
        run: |
          set +e
          python3 << 'PYEOF'
          import os, subprocess, json, urllib.parse, datetime, time

          h = os.environ['CPANEL_HOST']
          u = os.environ['CPANEL_USER']
          p = os.environ['CPANEL_PASS']
          uapi = f"https://{h}:2083/execute"
          domain = "tools.zulqurnainj.com"
          app_name = "tools"
          app_path = f"/home/{u}/{domain}"

          out = []
          def log(s): out.append(s); print(s)

          def cget(url, timeout=60):
              try: return subprocess.check_output(['curl','-sk','-u',f'{u}:{p}',url], text=True, timeout=timeout)
              except subprocess.TimeoutExpired: return "TIMEOUT"
              except Exception as e: return f"ERR: {e}"

          def cpost(url, data, timeout=60):
              cmd = ['curl','-sk','-u',f'{u}:{p}','-X','POST']
              for k,v in data.items(): cmd += ['--data-urlencode', f'{k}={v}']
              cmd.append(url)
              try: return subprocess.check_output(cmd, text=True, timeout=timeout)
              except Exception as e: return f"ERR: {e}"

          def parse(r):
              try:
                  d = json.loads(r)
                  return d.get('result', d) if 'result' in d else d
              except: return {'_raw': r[:300]}

          def ok(parsed): return isinstance(parsed, dict) and parsed.get('status') == 1

          def write_htaccess(nodejs_path):
              content = (
                  "# DO NOT REMOVE. CLOUDLINUX PASSENGER CONFIGURATION BEGIN\n"
                  "PassengerEnabled On\n"
                  "PassengerBaseURI /\n"
                  f"PassengerNodejs {nodejs_path}\n"
                  f"PassengerAppRoot {app_path}\n"
                  "PassengerAppType node\n"
                  "PassengerStartupFile startup.js\n"
                  "# DO NOT REMOVE. CLOUDLINUX PASSENGER CONFIGURATION END\n"
              )
              return cpost(f"{uapi}/Fileman/save_file_content", {"dir":app_path,"file":".htaccess","content":content})

          def touch_restart():
              return cpost(f"{uapi}/Fileman/save_file_content", {"dir":app_path+"/tmp","file":"restart.txt","content":str(time.time())})

          def http_check(timeout=20):
              try:
                  r = subprocess.check_output(['curl','-sk','-i','-o','-','-w','\\n@@CODE=%{http_code}','--max-time',str(timeout),f'http://{domain}/text-to-leads'], text=True, timeout=timeout+5)
                  first = r.split('\n')[0].strip()
                  code = ''
                  for line in r.split('\n'):
                      if line.startswith('@@CODE='):
                          code = line.split('=')[1].strip()
                  return f"code={code} first={first}", r[:1500]
              except subprocess.CalledProcessError as e:
                  return f"curl_err={e.returncode} (28=timeout, 7=connrefused)", ''
              except Exception as e:
                  return f"err={e}", ''

          log(f"# Doctor v5 — {datetime.datetime.utcnow().isoformat()}Z mode={os.environ.get('MODE','try-paths')}")
          log(f"- run: https://github.com/Zulqurnain/text-to-leads-extractor/actions/runs/{os.environ.get('GITHUB_RUN_ID','?')}")

          # ── Try ensure_deps_are_installed (might surface node path) ──
          log("\n## PassengerApps.ensure_deps_are_installed")
          log("```")
          r = cget(f"{uapi}/PassengerApps/ensure_deps_are_installed?name={app_name}", timeout=120)
          log(json.dumps(parse(r), indent=2)[:1500])
          log("```")

          # ── Try get a few node paths via Fileman/get_file_content ──
          # Even if list fails, get on a file should report if file exists
          log("\n## Probing node binary paths (via get_file_content)")
          log("```")
          candidates = [
              "/opt/cpanel/ea-nodejs22/bin/node",
              "/opt/cpanel/ea-nodejs20/bin/node",
              "/opt/cpanel/ea-nodejs18/bin/node",
              "/opt/alt/alt-nodejs22/root/usr/bin/node",
              "/opt/alt/alt-nodejs20/root/usr/bin/node",
              "/opt/alt/alt-nodejs18/root/usr/bin/node",
              "/usr/local/bin/node",
              "/usr/bin/node",
              "/opt/cpanel/ea-nodejs/bin/node",
              "/usr/local/cpanel/3rdparty/bin/node",
          ]
          for cand in candidates:
              dir_ = os.path.dirname(cand)
              name = os.path.basename(cand)
              # Try Fileman/stat_dir or get_file_metadata
              r = cget(f"{uapi}/Fileman/get_file_information?{urllib.parse.urlencode({'path':cand})}")
              d = parse(r)
              if ok(d):
                  log(f"  ✓ {cand} (stat ok)")
              else:
                  # Fallback: try get_file_content with small read
                  err = d.get('errors', ['?'])[0] if isinstance(d, dict) and d.get('errors') else 'unknown'
                  log(f"  ✗ {cand} ({err[:100]})")
          log("```")

          # ── Try via Cron module to list /opt/cpanel ──
          log("\n## Cron probe")
          log("```")
          r = cget(f"{uapi}/Cron/list_lines")
          log(json.dumps(parse(r), indent=2)[:500])
          log("```")

          # ── Read Apache vhost config to understand setup ──
          log("\n## Looking for Apache included confs in user home")
          log("```")
          r = cget(f"{uapi}/Fileman/list_files?{urllib.parse.urlencode({'dir':f'/home/{u}','types':'dir'})}")
          d = parse(r)
          if isinstance(d, dict) and 'data' in d:
              for f in (d['data'] or [])[:40]:
                  if isinstance(f, dict):
                      log(f"  {f.get('file')}")
          log("```")

          # ── Try various PassengerNodejs values and check response ──
          if os.environ.get('MODE') == 'try-paths':
              log("\n## Trying each node path in .htaccess and probing response")
              log("```")
              test_paths = [
                  "/opt/cpanel/ea-nodejs22/bin/node",
                  "/opt/cpanel/ea-nodejs20/bin/node",
                  "/opt/cpanel/ea-nodejs18/bin/node",
                  "/opt/alt/alt-nodejs22/root/usr/bin/node",
                  "/opt/alt/alt-nodejs20/root/usr/bin/node",
                  "/opt/alt/alt-nodejs18/root/usr/bin/node",
                  "/usr/local/bin/node",
                  "/usr/bin/node",
              ]
              best = None
              for path in test_paths:
                  log(f"\n--- Trying PassengerNodejs={path} ---")
                  r = write_htaccess(path)
                  log(f"  write .htaccess ok={ok(parse(r))}")
                  touch_restart()
                  # Need to disable+enable for full restart
                  cget(f"{uapi}/PassengerApps/disable_application?name={app_name}")
                  time.sleep(2)
                  r = cget(f"{uapi}/PassengerApps/enable_application?name={app_name}")
                  log(f"  enable ok={ok(parse(r))}")
                  # Wait less per try
                  time.sleep(10)
                  status, body = http_check(timeout=10)
                  log(f"  result: {status}")
                  if 'code=200' in status or 'code=301' in status or 'code=302' in status or 'code=404' in status or 'code=500' in status:
                      # Got a response (not a timeout)
                      log(f"  *** GOT RESPONSE from {path}! ***")
                      log(f"  body:\n{body[:800]}")
                      best = path
                      break
              if best:
                  log(f"\n  ✓ WORKING node binary: {best}")
                  # Final verify with full restart
                  cget(f"{uapi}/PassengerApps/disable_application?name={app_name}")
                  time.sleep(3)
                  cget(f"{uapi}/PassengerApps/enable_application?name={app_name}")
                  time.sleep(20)
                  status, body = http_check(timeout=20)
                  log(f"  Final check (20s wait): {status}")
              else:
                  log("\n  ✗ No node path worked — ALL timed out")
              log("```")

          # ── Final ──
          log("\n## Final external check")
          log("```")
          for url in (f'http://{domain}/text-to-leads', f'https://{domain}/text-to-leads'):
              try:
                  r = subprocess.check_output(['curl','-sk','-o','/dev/null','-w','%{http_code}','--max-time','20',url], text=True, timeout=25)
                  log(f"{url} → {r}")
              except Exception as e:
                  log(f"{url}: {e}")
          log("```")

          stamp = datetime.datetime.utcnow().strftime('%Y%m%d-%H%M%S')
          content = '\n'.join(out)
          os.makedirs('.diag', exist_ok=True)
          open('.diag/latest.md','w').write(content)
          open(f'.diag/{stamp}-v5.md','w').write(content)
          print(f"\nWrote .diag/latest.md ({len(content)} chars)")
          PYEOF

          git config user.email "tools-doctor@github-actions"
          git config user.name "tools-doctor"
          git add .diag/
          git commit -m "diag [skip ci]: v5 try-paths @ $(date -u +%Y%m%d-%H%M%S)" || echo "nothing to commit"
          git push origin master 2>&1 | tail -5 || echo "push failed"
