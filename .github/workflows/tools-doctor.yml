name: Tools Doctor — diagnose tools.zulqurnainj.com via cPanel UAPI

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'diagnose | fix-passenger | fix-ssl | full-fix'
        default: 'full-fix'
        required: true
  push:
    branches: [master]
    paths:
      - '.github/workflows/tools-doctor.yml'
      - '.github/doctor-trigger.txt'

concurrency:
  group: tools-doctor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Doctor (UAPI-only, no SSH required)
        env:
          MODE: ${{ inputs.mode || 'full-fix' }}
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_PASS: ${{ secrets.CPANEL_PASS }}
        run: |
          set +e
          python3 << 'PYEOF'
          import os, subprocess, json, urllib.parse, datetime, time, base64, sys

          h = os.environ.get('CPANEL_HOST','')
          u = os.environ.get('CPANEL_USER','')
          p = os.environ.get('CPANEL_PASS','')
          mode = os.environ.get('MODE','full-fix')
          uapi = f"https://{h}:2083/execute"
          domain = "tools.zulqurnainj.com"
          app_name = "tools"
          app_path = f"/home/{u}/{domain}"

          out_lines = []
          def log(s):
              out_lines.append(s)
              print(s)

          def curl_get(url, timeout=60):
              try:
                  return subprocess.check_output(
                      ['curl', '-sk', '-u', f'{u}:{p}', url],
                      text=True, timeout=timeout
                  )
              except Exception as e:
                  return f"CURL_ERR: {e}"

          def curl_post(url, data, timeout=60):
              cmd = ['curl', '-sk', '-u', f'{u}:{p}', '-X', 'POST']
              for k, v in data.items():
                  cmd += ['--data-urlencode', f'{k}={v}']
              cmd.append(url)
              try:
                  return subprocess.check_output(cmd, text=True, timeout=timeout)
              except Exception as e:
                  return f"CURL_ERR: {e}"

          def parse(resp):
              try:
                  d = json.loads(resp)
                  if 'result' in d:
                      return d['result']
                  return d
              except Exception:
                  return {'_raw': resp[:300], '_parse_err': True}

          def ok(parsed):
              return isinstance(parsed, dict) and parsed.get('status') == 1

          # Header
          log(f"# tools-doctor diagnostic (UAPI-only)")
          log(f"- timestamp: {datetime.datetime.utcnow().isoformat()}Z")
          log(f"- mode: {mode}")
          log(f"- commit: {os.environ.get('GITHUB_SHA','?')}")
          log(f"- run: https://github.com/Zulqurnain/text-to-leads-extractor/actions/runs/{os.environ.get('GITHUB_RUN_ID','?')}")
          log("")

          # ── External probes ──
          log("## External probes (from runner)")
          log("```")
          try:
              dns = subprocess.check_output(['getent', 'ahosts', domain], text=True, timeout=10)
              log("DNS: " + dns.split('\n')[0])
          except Exception as e:
              log(f"DNS err: {e}")
          for url in (f"http://{domain}/text-to-leads", f"https://{domain}/text-to-leads"):
              try:
                  r = subprocess.check_output(
                      ['curl', '-sk', '-i', '--max-time', '15', '-w', '\n@@@ http_code=%{http_code}', url],
                      text=True, timeout=20
                  )
                  log(f"--- {url} ---")
                  log(r[:1500])
              except subprocess.CalledProcessError as e:
                  log(f"{url}: CalledProcessError code={e.returncode} stderr={(e.stderr or '')[:200]}")
              except Exception as e:
                  log(f"{url}: {e}")
          # TLS cert info
          try:
              tls = subprocess.run(
                  ['bash','-c',f'echo | openssl s_client -connect {domain}:443 -servername {domain} 2>/dev/null | openssl x509 -noout -subject -issuer -dates -ext subjectAltName 2>&1'],
                  capture_output=True, text=True, timeout=20
              )
              log("TLS:\n" + (tls.stdout or '') + (tls.stderr or ''))
          except Exception as e:
              log(f"TLS err: {e}")
          log("```")

          # ── UAPI: list Passenger apps ──
          log("\n## UAPI: PassengerApps.list_applications")
          log("```")
          r = curl_get(f"{uapi}/PassengerApps/list_applications")
          p_list = parse(r)
          log(json.dumps(p_list, indent=2)[:3000])
          log("```")

          # ── UAPI: get_file_content for .htaccess ──
          log("\n## UAPI: Fileman.get_file_content .htaccess")
          log("```")
          ht_params = urllib.parse.urlencode({"dir": app_path, "file": ".htaccess"})
          r = curl_get(f"{uapi}/Fileman/get_file_content?{ht_params}")
          ht_data = parse(r)
          log(json.dumps(ht_data, indent=2)[:2000])
          log("```")

          # ── UAPI: list_files for app dir ──
          log("\n## UAPI: Fileman.list_files app dir")
          log("```")
          lf_params = urllib.parse.urlencode({"dir": app_path})
          r = curl_get(f"{uapi}/Fileman/list_files?{lf_params}&types=file")
          lf_data = parse(r)
          # Truncate but show all filenames
          if isinstance(lf_data, dict) and 'data' in lf_data:
              files = lf_data['data'] or []
              log(f"Found {len(files)} files:")
              for f in files[:80]:
                  if isinstance(f, dict):
                      log(f"  {f.get('file','?')} ({f.get('size','?')} bytes)")
          else:
              log(json.dumps(lf_data, indent=2)[:1000])
          log("```")

          # ── UAPI: SSL certs ──
          log("\n## UAPI: SSL.list_certs")
          log("```")
          r = curl_get(f"{uapi}/SSL/list_certs")
          ssl_data = parse(r)
          if isinstance(ssl_data, dict) and 'data' in ssl_data:
              for c in (ssl_data['data'] or [])[:5]:
                  log(f"  domains={c.get('domains','?')} issuer={c.get('issuer','?')} expires={c.get('not_after','?')}")
          else:
              log(json.dumps(ssl_data, indent=2)[:1000])
          log("```")

          # ── UAPI: installed SSL on domain ──
          log("\n## UAPI: SSL.installed_host")
          log("```")
          inst_params = urllib.parse.urlencode({"domain": domain})
          r = curl_get(f"{uapi}/SSL/installed_host?{inst_params}")
          log(json.dumps(parse(r), indent=2)[:1500])
          log("```")

          # ── FIX-PASSENGER ──
          if mode in ('fix-passenger','full-fix'):
              log("\n## Apply fix-passenger")
              log("```")
              # Deregister first to clear stale state
              r = curl_get(f"{uapi}/PassengerApps/deregister_application?name={app_name}")
              log(f"deregister: ok={ok(parse(r))}")
              time.sleep(3)
              # Register
              registered_node = None
              for node_ver in ('22','20','18'):
                  reg_params = urllib.parse.urlencode({
                      "name": app_name, "path": app_path, "domain": domain,
                      "base_uri": "/", "startup_file": "startup.js",
                      "app_type": "node", "node_version": node_ver,
                      "deployment_mode": "production",
                  })
                  r = curl_get(f"{uapi}/PassengerApps/register_application?{reg_params}")
                  parsed = parse(r)
                  log(f"register node {node_ver}: ok={ok(parsed)} resp={json.dumps(parsed)[:200]}")
                  if ok(parsed):
                      registered_node = node_ver
                      break
              if not registered_node:
                  registered_node = '22'
                  log("All registrations returned non-OK — defaulting to 22")
              # Discover real nodejs path
              r = curl_get(f"{uapi}/PassengerApps/list_applications")
              apps_resp = parse(r)
              nodejs_path = None
              if isinstance(apps_resp, dict):
                  apps = apps_resp.get('data', {}) or {}
                  if isinstance(apps, dict):
                      apps = apps.get('applications', []) or []
                  if isinstance(apps, list):
                      for a in apps:
                          if isinstance(a, dict) and a.get('name') == app_name:
                              nodejs_path = (a.get('nodejs_path') or a.get('node_path')
                                            or a.get('nodejs_binary') or a.get('node_binary'))
                              log(f"App record: {json.dumps(a)[:400]}")
                              break
              if not nodejs_path:
                  nodejs_path = f"/home/{u}/nodevenv/{domain}/{registered_node}/bin/node"
                  log(f"Using fallback nodejs_path: {nodejs_path}")
              else:
                  log(f"nodejs_path from API: {nodejs_path}")
              # Write .htaccess
              htaccess = (
                  "# DO NOT REMOVE. CLOUDLINUX PASSENGER CONFIGURATION BEGIN\n"
                  "PassengerEnabled On\n"
                  "PassengerBaseURI /\n"
                  f"PassengerNodejs {nodejs_path}\n"
                  f"PassengerAppRoot {app_path}\n"
                  "PassengerAppType node\n"
                  "PassengerStartupFile startup.js\n"
                  "# DO NOT REMOVE. CLOUDLINUX PASSENGER CONFIGURATION END\n"
              )
              r = curl_post(
                  f"{uapi}/Fileman/save_file_content",
                  {"dir": app_path, "filename": ".htaccess", "content": htaccess}
              )
              log(f"save_file_content .htaccess: ok={ok(parse(r))} resp={r[:300]}")
              # Restart
              r = curl_get(f"{uapi}/PassengerApps/disable_application?name={app_name}")
              log(f"disable: ok={ok(parse(r))}")
              time.sleep(3)
              r = curl_get(f"{uapi}/PassengerApps/enable_application?name={app_name}")
              log(f"enable: ok={ok(parse(r))}")
              log("waiting 20s for Passenger to start app...")
              time.sleep(20)
              # Verify
              try:
                  r = subprocess.check_output(
                      ['curl', '-sk', '-i', '--max-time', '15', f'http://{domain}/text-to-leads'],
                      text=True, timeout=20
                  )
                  log(f"--- After fix HTTP ---\n{r[:1000]}")
              except Exception as e:
                  log(f"HTTP after fix: {e}")
              log("```")

          # ── FIX-SSL ──
          if mode in ('fix-ssl','full-fix'):
              log("\n## Apply fix-ssl")
              log("```")
              # Backup .htaccess to .htaccess.passenger then write a minimal one (no Passenger)
              # so ACME challenge can pass before Passenger intercepts.
              # Read current .htaccess
              ht_get = curl_get(f"{uapi}/Fileman/get_file_content?{urllib.parse.urlencode({'dir':app_path,'file':'.htaccess'})}")
              ht_parsed = parse(ht_get)
              cur_content = ''
              if isinstance(ht_parsed, dict):
                  data = ht_parsed.get('data')
                  if isinstance(data, dict):
                      cur_content = data.get('content','')
              # Save backup
              r = curl_post(
                  f"{uapi}/Fileman/save_file_content",
                  {"dir": app_path, "filename": ".htaccess.passenger.bak", "content": cur_content}
              )
              log(f"backup .htaccess: ok={ok(parse(r))}")
              # Write minimal .htaccess (no Passenger)
              r = curl_post(
                  f"{uapi}/Fileman/save_file_content",
                  {"dir": app_path, "filename": ".htaccess", "content": "Options -Indexes\n"}
              )
              log(f"minimal .htaccess: ok={ok(parse(r))}")
              # Trigger AutoSSL
              r = curl_get(f"{uapi}/SSL/start_autossl_check_cpanel_domains", timeout=180)
              log(f"AutoSSL: ok={ok(parse(r))} resp={r[:300]}")
              # Try LetsEncrypt/install_ssl
              le_params = urllib.parse.urlencode({"domain": domain})
              r = curl_get(f"{uapi}/LetsEncrypt/issue?domains[0]={domain}&keytype=prime256v1", timeout=300)
              log(f"LetsEncrypt issue: ok={ok(parse(r))} resp={r[:500]}")
              # Wait and verify TLS
              log("waiting 30s for cert provision...")
              time.sleep(30)
              # Check cert
              try:
                  tls = subprocess.run(
                      ['bash','-c',f'echo | openssl s_client -connect {domain}:443 -servername {domain} 2>/dev/null | openssl x509 -noout -subject -issuer -dates 2>&1'],
                      capture_output=True, text=True, timeout=20
                  )
                  log("TLS after SSL fix:\n" + (tls.stdout or '') + (tls.stderr or ''))
              except Exception as e:
                  log(f"TLS check err: {e}")
              # Restore Passenger .htaccess if we have a node path
              if cur_content and 'Passenger' in cur_content:
                  r = curl_post(
                      f"{uapi}/Fileman/save_file_content",
                      {"dir": app_path, "filename": ".htaccess", "content": cur_content}
                  )
                  log(f"restore .htaccess: ok={ok(parse(r))}")
                  # Restart
                  curl_get(f"{uapi}/PassengerApps/disable_application?name={app_name}")
                  time.sleep(3)
                  curl_get(f"{uapi}/PassengerApps/enable_application?name={app_name}")
                  time.sleep(10)
              log("```")

          # ── Final external check ──
          log("\n## Final external check")
          log("```")
          for url in (f"http://{domain}/text-to-leads", f"https://{domain}/text-to-leads"):
              try:
                  r = subprocess.check_output(
                      ['curl', '-sk', '-o', '/dev/null', '-w', '%{http_code} %{ssl_verify_result}', '--max-time', '15', url],
                      text=True, timeout=20
                  )
                  log(f"{url} → {r}")
              except Exception as e:
                  log(f"{url}: {e}")
          log("```")

          # Save to .diag
          stamp = datetime.datetime.utcnow().strftime('%Y%m%d-%H%M%S')
          content = '\n'.join(out_lines)
          os.makedirs('.diag', exist_ok=True)
          with open('.diag/latest.md','w') as f:
              f.write(content)
          with open(f'.diag/{stamp}-{mode}.md','w') as f:
              f.write(content)
          print(f"\nWrote .diag/latest.md ({len(content)} chars)")
          PYEOF

          # Commit and push
          git config user.email "tools-doctor@github-actions"
          git config user.name "tools-doctor"
          git add .diag/
          git commit -m "diag [skip ci]: ${MODE} @ $(date -u +%Y%m%d-%H%M%S)" || echo "nothing to commit"
          git push origin master 2>&1 | tail -5 || echo "push failed"
