name: Tools Doctor v3 — deep probe via UAPI

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'diagnose | restart | fix-passenger | fix-ssl | full-fix'
        default: 'diagnose'
        required: true
  push:
    branches: [master]
    paths:
      - '.github/workflows/tools-doctor.yml'
      - '.github/doctor-trigger.txt'

concurrency:
  group: tools-doctor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Doctor v3
        env:
          MODE: ${{ inputs.mode || 'diagnose' }}
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_PASS: ${{ secrets.CPANEL_PASS }}
        run: |
          set +e
          python3 << 'PYEOF'
          import os, subprocess, json, urllib.parse, datetime, time

          h = os.environ['CPANEL_HOST']
          u = os.environ['CPANEL_USER']
          p = os.environ['CPANEL_PASS']
          mode = os.environ.get('MODE','diagnose')
          uapi = f"https://{h}:2083/execute"
          domain = "tools.zulqurnainj.com"
          app_name = "tools"
          app_path = f"/home/{u}/{domain}"

          out = []
          def log(s): out.append(s); print(s)

          def cget(url, timeout=60):
              try:
                  return subprocess.check_output(['curl','-sk','-u',f'{u}:{p}',url], text=True, timeout=timeout)
              except subprocess.TimeoutExpired:
                  return "TIMEOUT"
              except Exception as e:
                  return f"ERR: {e}"

          def cpost(url, data, timeout=60):
              cmd = ['curl','-sk','-u',f'{u}:{p}','-X','POST']
              for k,v in data.items(): cmd += ['--data-urlencode', f'{k}={v}']
              cmd.append(url)
              try:
                  return subprocess.check_output(cmd, text=True, timeout=timeout)
              except Exception as e:
                  return f"ERR: {e}"

          def parse(r):
              try:
                  d = json.loads(r)
                  return d.get('result', d) if 'result' in d else d
              except: return {'_raw': r[:500]}

          def ok(p): return isinstance(p, dict) and p.get('status') == 1

          log(f"# Doctor v3 — {datetime.datetime.utcnow().isoformat()}Z mode={mode}")
          log(f"- commit: {os.environ.get('GITHUB_SHA','?')}")
          log(f"- run: https://github.com/Zulqurnain/text-to-leads-extractor/actions/runs/{os.environ.get('GITHUB_RUN_ID','?')}")

          # ── List ALL items (files + dirs) in app dir ──
          log("\n## App dir listing (files + dirs)")
          log("```")
          r = cget(f"{uapi}/Fileman/list_files?{urllib.parse.urlencode({'dir':app_path,'types':'file|dir'})}")
          d = parse(r)
          if isinstance(d, dict) and 'data' in d:
              for f in (d['data'] or [])[:100]:
                  if isinstance(f, dict):
                      log(f"  [{f.get('type','?')}] {f.get('file','?')} ({f.get('size','?')} bytes)")
          else:
              log(json.dumps(d, indent=2)[:1500])
          log("```")

          # ── Check .next directory ──
          log("\n## .next/ directory")
          log("```")
          r = cget(f"{uapi}/Fileman/list_files?{urllib.parse.urlencode({'dir':app_path+'/.next','types':'file|dir'})}")
          d = parse(r)
          if isinstance(d, dict) and 'data' in d:
              for f in (d['data'] or [])[:30]:
                  if isinstance(f, dict):
                      log(f"  [{f.get('type','?')}] {f.get('file','?')}")
          else:
              log(json.dumps(d, indent=2)[:800])
          log("```")

          # ── Check node_modules ──
          log("\n## node_modules existence")
          log("```")
          r = cget(f"{uapi}/Fileman/list_files?{urllib.parse.urlencode({'dir':app_path+'/node_modules','types':'dir'})}")
          d = parse(r)
          if isinstance(d, dict) and 'data' in d:
              dirs = [f for f in (d['data'] or []) if isinstance(f, dict)]
              log(f"  Found {len(dirs)} subdirs (showing first 15):")
              for f in dirs[:15]:
                  log(f"  {f.get('file','?')}")
          else:
              log(json.dumps(d, indent=2)[:600])
          log("```")

          # ── Check nodevenv ──
          log("\n## nodevenv/tools.zulqurnainj.com")
          log("```")
          r = cget(f"{uapi}/Fileman/list_files?{urllib.parse.urlencode({'dir':f'/home/{u}/nodevenv/{domain}','types':'file|dir'})}")
          d = parse(r)
          if isinstance(d, dict) and 'data' in d:
              for f in (d['data'] or []):
                  if isinstance(f, dict):
                      log(f"  [{f.get('type','?')}] {f.get('file','?')}")
          else:
              log(json.dumps(d, indent=2)[:600])
          log("```")

          # ── Read .env to confirm structure ──
          log("\n## .env content (sanitized)")
          log("```")
          r = cget(f"{uapi}/Fileman/get_file_content?{urllib.parse.urlencode({'dir':app_path,'file':'.env'})}")
          d = parse(r)
          if isinstance(d, dict) and 'data' in d and isinstance(d['data'], dict):
              content = d['data'].get('content','')
              for line in content.split('\n'):
                  if any(s in line.upper() for s in ['PASS','SECRET','KEY=']):
                      k = line.split('=',1)[0] if '=' in line else line
                      log(f"  {k}=<redacted>")
                  else:
                      log(f"  {line}")
          else:
              log(json.dumps(d, indent=2)[:500])
          log("```")

          # ── Read startup.js ──
          log("\n## startup.js content")
          log("```")
          r = cget(f"{uapi}/Fileman/get_file_content?{urllib.parse.urlencode({'dir':app_path,'file':'startup.js'})}")
          d = parse(r)
          if isinstance(d, dict) and 'data' in d and isinstance(d['data'], dict):
              log(d['data'].get('content','')[:1000])
          else:
              log(json.dumps(d, indent=2)[:500])
          log("```")

          # ── Passenger app state ──
          log("\n## PassengerApps.list_applications")
          log("```")
          r = cget(f"{uapi}/PassengerApps/list_applications")
          log(json.dumps(parse(r), indent=2)[:2000])
          log("```")

          # ── Passenger error log ──
          log("\n## Passenger error log (~/logs/ + ~/.cl.selector/)")
          log("```")
          # Try various log locations
          log_paths = [
              (f'/home/{u}/logs', 'tools.zulqurnainj.com.error.log'),
              (f'/home/{u}/logs', 'error_log'),
              (f'/home/{u}/.cl.selector', 'passenger_log'),
              (f'/home/{u}', 'error_log'),
          ]
          for dir_, fname in log_paths:
              r = cget(f"{uapi}/Fileman/get_file_content?{urllib.parse.urlencode({'dir':dir_,'file':fname})}")
              d = parse(r)
              if isinstance(d, dict) and 'data' in d and isinstance(d['data'], dict):
                  c = d['data'].get('content','')
                  if c:
                      log(f"--- {dir_}/{fname} (last 2000 chars) ---")
                      log(c[-2000:])
          # Also list ~/logs to see what's there
          r = cget(f"{uapi}/Fileman/list_files?{urllib.parse.urlencode({'dir':f'/home/{u}/logs','types':'file'})}")
          d = parse(r)
          if isinstance(d, dict) and 'data' in d:
              log(f"\n--- ~/logs directory ---")
              for f in (d['data'] or [])[:20]:
                  if isinstance(f, dict):
                      log(f"  {f.get('file','?')} ({f.get('size','?')} bytes)")
          log("```")

          # ── Available SSL cert info ──
          log("\n## SSL.list_certs")
          log("```")
          r = cget(f"{uapi}/SSL/list_certs")
          d = parse(r)
          if isinstance(d, dict) and 'data' in d:
              for c in (d['data'] or [])[:10]:
                  log(f"  domains={c.get('domains','?')} expires={c.get('not_after','?')}")
          else:
              log(json.dumps(d, indent=2)[:600])
          log("```")

          # ── ACTIONS ──

          if mode in ('restart','fix-passenger','full-fix'):
              log("\n## Restart Passenger (no re-register)")
              log("```")
              r = cget(f"{uapi}/PassengerApps/disable_application?name={app_name}")
              log(f"disable: ok={ok(parse(r))}")
              time.sleep(3)
              r = cget(f"{uapi}/PassengerApps/enable_application?name={app_name}")
              log(f"enable: ok={ok(parse(r))}")
              log("waiting 20s...")
              time.sleep(20)
              try:
                  r = subprocess.check_output(['curl','-sk','-i','--max-time','20',f'http://{domain}/text-to-leads'], text=True, timeout=25)
                  log(f"--- HTTP after restart ---\n{r[:800]}")
              except subprocess.CalledProcessError as e:
                  log(f"HTTP code 28 (timeout): app still hanging")
              except Exception as e:
                  log(f"HTTP err: {e}")
              log("```")

          if mode in ('fix-ssl','full-fix'):
              log("\n## Fix SSL")
              log("```")
              # Backup .htaccess
              ht_get = cget(f"{uapi}/Fileman/get_file_content?{urllib.parse.urlencode({'dir':app_path,'file':'.htaccess'})}")
              ht_data = parse(ht_get)
              cur = ''
              if isinstance(ht_data, dict) and 'data' in ht_data and isinstance(ht_data['data'], dict):
                  cur = ht_data['data'].get('content','')
              if cur:
                  r = cpost(f"{uapi}/Fileman/save_file_content", {"dir":app_path,"file":".htaccess.passenger.bak","content":cur})
                  log(f"backup .htaccess: ok={ok(parse(r))}")
              # Minimal .htaccess for ACME
              r = cpost(f"{uapi}/Fileman/save_file_content", {"dir":app_path,"file":".htaccess","content":"Options -Indexes\n"})
              log(f"minimal .htaccess: ok={ok(parse(r))} resp={r[:200]}")
              # Wait a moment for filesystem
              time.sleep(2)
              # Try multiple SSL functions
              for fn in ['SSL/start_autossl_check', 'SSL/start_autossl_check_cpanel_domains']:
                  r = cget(f"{uapi}/{fn}", timeout=180)
                  log(f"{fn}: ok={ok(parse(r))} resp={r[:300]}")
              # LetsEncrypt - try install_ssl and issue
              r = cget(f"{uapi}/LetsEncrypt/install_ssl?{urllib.parse.urlencode({'domains[0]':domain,'wildcard':'0'})}", timeout=300)
              log(f"LetsEncrypt install_ssl: ok={ok(parse(r))} resp={r[:500]}")
              # Wait for cert
              log("waiting 45s for SSL to provision...")
              time.sleep(45)
              # Check cert
              try:
                  tls = subprocess.run(['bash','-c',f'echo | openssl s_client -connect {domain}:443 -servername {domain} 2>/dev/null | openssl x509 -noout -subject -issuer 2>&1'], capture_output=True, text=True, timeout=20)
                  log(f"TLS:\n{(tls.stdout or '')+(tls.stderr or '')}")
              except Exception as e:
                  log(f"TLS check err: {e}")
              # Restore Passenger .htaccess
              if cur and 'Passenger' in cur:
                  r = cpost(f"{uapi}/Fileman/save_file_content", {"dir":app_path,"file":".htaccess","content":cur})
                  log(f"restore Passenger .htaccess: ok={ok(parse(r))}")
                  cget(f"{uapi}/PassengerApps/disable_application?name={app_name}")
                  time.sleep(3)
                  cget(f"{uapi}/PassengerApps/enable_application?name={app_name}")
              log("```")

          # ── Final check ──
          log("\n## Final external check")
          log("```")
          for url in (f'http://{domain}/text-to-leads', f'https://{domain}/text-to-leads'):
              try:
                  r = subprocess.check_output(['curl','-sk','-i','--max-time','20',url], text=True, timeout=25)
                  log(f"--- {url} ---")
                  log(r[:1000])
              except subprocess.CalledProcessError as e:
                  log(f"{url}: timeout/error (code {e.returncode})")
              except Exception as e:
                  log(f"{url}: {e}")
          log("```")

          stamp = datetime.datetime.utcnow().strftime('%Y%m%d-%H%M%S')
          content = '\n'.join(out)
          os.makedirs('.diag', exist_ok=True)
          open('.diag/latest.md','w').write(content)
          open(f'.diag/{stamp}-{mode}.md','w').write(content)
          print(f"\nWrote .diag/latest.md ({len(content)} chars)")
          PYEOF

          git config user.email "tools-doctor@github-actions"
          git config user.name "tools-doctor"
          git add .diag/
          git commit -m "diag [skip ci]: ${MODE} @ $(date -u +%Y%m%d-%H%M%S)" || echo "nothing to commit"
          git push origin master 2>&1 | tail -5 || echo "push failed"
