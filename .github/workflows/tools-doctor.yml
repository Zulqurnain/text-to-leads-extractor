name: Tools Doctor — diagnose tools.zulqurnainj.com

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'diagnose | fix-passenger | fix-ssl | restart-only'
        default: 'fix-passenger'
        required: true
  push:
    branches: [master]
    paths:
      - '.github/workflows/tools-doctor.yml'
      - '.github/doctor-trigger.txt'

concurrency:
  group: tools-doctor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Doctor (all-in-one, never fails)
        env:
          MODE: ${{ inputs.mode || 'fix-passenger' }}
          SSH_HOST: ${{ secrets.FTP_SERVER }}
          SSH_USER: ${{ secrets.FTP_USERNAME }}
          SSH_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          set +e
          mkdir -p .diag
          DIAG=.diag/latest.md
          STAMP=$(date -u +%Y%m%d-%H%M%S)

          # Always start with a header so the file is never empty
          {
            echo "# tools-doctor diagnostic"
            echo "- timestamp: $(date -u)"
            echo "- mode: $MODE"
            echo "- commit: $GITHUB_SHA"
            echo "- run: https://github.com/Zulqurnain/text-to-leads-extractor/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "## External probes (from runner)"
            echo
            echo '```'
            echo "--- DNS ---"
            getent ahosts tools.zulqurnainj.com 2>&1 | head
            echo "--- HTTP /text-to-leads ---"
            curl -sk -i --max-time 15 http://tools.zulqurnainj.com/text-to-leads 2>&1 | head -25
            echo "--- HTTPS /text-to-leads ---"
            curl -sk -i --max-time 15 https://tools.zulqurnainj.com/text-to-leads 2>&1 | head -25
            echo "--- TLS cert ---"
            echo | openssl s_client -connect tools.zulqurnainj.com:443 -servername tools.zulqurnainj.com 2>/dev/null | openssl x509 -noout -subject -issuer -dates -ext subjectAltName 2>&1
            echo '```'
          } > "$DIAG"

          # Verify secrets are set
          {
            echo
            echo "## Secrets status"
            echo
            echo '```'
            [ -n "$SSH_HOST" ] && echo "SSH_HOST: set" || echo "SSH_HOST: MISSING"
            [ -n "$SSH_USER" ] && echo "SSH_USER: set" || echo "SSH_USER: MISSING"
            [ -n "$SSH_PASS" ] && echo "SSH_PASS: set" || echo "SSH_PASS: MISSING"
            echo '```'
          } >> "$DIAG"

          # Install sshpass
          echo "## sshpass install" >> "$DIAG"
          echo '```' >> "$DIAG"
          sudo apt-get update -q 2>&1 | tail -3 >> "$DIAG"
          sudo apt-get install -y sshpass 2>&1 | tail -3 >> "$DIAG"
          which sshpass >> "$DIAG" 2>&1
          echo '```' >> "$DIAG"

          if [ -n "$SSH_HOST" ] && [ -n "$SSH_USER" ] && [ -n "$SSH_PASS" ]; then
            echo "## SSH connection test" >> "$DIAG"
            echo '```' >> "$DIAG"
            SSH_CMD="sshpass -p \"$SSH_PASS\" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -p YOUR_SFTP_PORT $SSH_USER@$SSH_HOST"
            eval "$SSH_CMD 'echo CONNECTED; whoami; hostname; pwd'" 2>&1 | head -10 >> "$DIAG"
            echo '```' >> "$DIAG"

            # Run remote diagnostic via inline command
            echo "## Remote diagnostic" >> "$DIAG"
            echo '```' >> "$DIAG"
            eval "$SSH_CMD 'set +e; APPDIR=\$HOME/tools.zulqurnainj.com; echo \"=== \$(date -u) ===\"; echo \"--- listing \$APPDIR ---\"; ls -la \"\$APPDIR/\" 2>&1 | head -30; echo \"--- .htaccess ---\"; cat \"\$APPDIR/.htaccess\" 2>&1 | head -20; echo \"--- server.js / startup.js ---\"; ls -la \"\$APPDIR/server.js\" \"\$APPDIR/startup.js\" 2>&1; echo \"--- env (sanitized) ---\"; grep -vi \"PASS|SECRET|KEY\" \"\$APPDIR/.env\" 2>&1 | head -20; echo \"--- nodevenv ---\"; ls -la \$HOME/nodevenv/tools.zulqurnainj.com/ 2>&1 | head; for v in 18 20 22; do NB=\$HOME/nodevenv/tools.zulqurnainj.com/\$v/bin/node; [ -x \"\$NB\" ] && echo \"OK node \$v\" || echo \"-- node \$v missing\"; done; echo \"--- uapi list_applications ---\"; uapi PassengerApps list_applications 2>&1 | head -40; echo \"--- self-check ---\"; curl -sk -i --max-time 8 http://tools.zulqurnainj.com/text-to-leads 2>&1 | head -10'" 2>&1 | head -150 >> "$DIAG"
            echo '```' >> "$DIAG"

            # If mode is fix-passenger or fix-ssl, apply fix
            if [ "$MODE" = "fix-passenger" ]; then
              echo "## Applying fix-passenger" >> "$DIAG"
              echo '```' >> "$DIAG"
              eval "$SSH_CMD 'set +e; APPDIR=\$HOME/tools.zulqurnainj.com; NB=\"\"; for v in 22 20 18; do [ -x \$HOME/nodevenv/tools.zulqurnainj.com/\$v/bin/node ] && { NB=\$HOME/nodevenv/tools.zulqurnainj.com/\$v/bin/node; echo \"using node \$v: \$NB\"; break; }; done; if [ -z \"\$NB\" ]; then echo \"no nodevenv; calling register_application\"; uapi PassengerApps register_application name=tools path=\$APPDIR domain=tools.zulqurnainj.com base_uri=/ startup_file=startup.js app_type=node node_version=22 deployment_mode=production 2>&1 | head -10; sleep 8; for v in 22 20 18; do [ -x \$HOME/nodevenv/tools.zulqurnainj.com/\$v/bin/node ] && { NB=\$HOME/nodevenv/tools.zulqurnainj.com/\$v/bin/node; break; }; done; fi; if [ -n \"\$NB\" ]; then HT=\$APPDIR/.htaccess; printf \"PassengerEnabled On\nPassengerBaseURI /\nPassengerNodejs %s\nPassengerAppRoot %s\nPassengerAppType node\nPassengerStartupFile startup.js\n\" \"\$NB\" \"\$APPDIR\" > \"\$HT\"; cat \"\$HT\"; mkdir -p \$APPDIR/tmp; date > \$APPDIR/tmp/restart.txt; uapi PassengerApps disable_application name=tools 2>&1 | head -3; sleep 2; uapi PassengerApps enable_application name=tools 2>&1 | head -3; sleep 12; echo \"--- post restart ---\"; curl -sk -i --max-time 10 http://tools.zulqurnainj.com/text-to-leads 2>&1 | head -12; else echo NO_NODE_FOUND; fi'" 2>&1 | head -80 >> "$DIAG"
              echo '```' >> "$DIAG"
            fi

            if [ "$MODE" = "fix-ssl" ]; then
              echo "## Applying fix-ssl" >> "$DIAG"
              echo '```' >> "$DIAG"
              eval "$SSH_CMD 'set +e; APPDIR=\$HOME/tools.zulqurnainj.com; cp \$APPDIR/.htaccess \$APPDIR/.htaccess.ssl-bak 2>/dev/null; printf \"Options -Indexes\n\" > \$APPDIR/.htaccess; mkdir -p \$APPDIR/.well-known/acme-challenge; echo PROBE > \$APPDIR/.well-known/acme-challenge/probe; echo \"--- ACME probe ---\"; curl -sv --max-time 8 http://tools.zulqurnainj.com/.well-known/acme-challenge/probe 2>&1 | head -8; rm -f \$APPDIR/.well-known/acme-challenge/probe; uapi HTTP disable_force_https domain=tools.zulqurnainj.com 2>&1 | head -3; echo \"--- AutoSSL ---\"; uapi SSL start_autossl_check_cpanel_domains 2>&1 | head -10; echo \"--- LetsEncrypt install_ssl ---\"; uapi LetsEncrypt install_ssl domains=[\\{\\\"domain\\\":\\\"tools.zulqurnainj.com\\\",\\\"wildcard\\\":false\\}] 2>&1 | head -20; sleep 30; echo \"--- HTTPS after SSL ---\"; echo | openssl s_client -connect tools.zulqurnainj.com:443 -servername tools.zulqurnainj.com 2>/dev/null | openssl x509 -noout -subject -issuer -dates 2>&1'" 2>&1 | head -80 >> "$DIAG"
              echo '```' >> "$DIAG"
            fi
          else
            echo "## SSH credentials missing — skipping remote steps" >> "$DIAG"
          fi

          echo "## Final preview (truncated to 5000 chars)" >> "$DIAG"
          tail -c 5000 "$DIAG" || true

          # Commit and push
          cp "$DIAG" ".diag/${STAMP}-${MODE}.md"
          git config user.email "tools-doctor@github-actions"
          git config user.name "tools-doctor"
          git add .diag/
          git commit -m "diag [skip ci]: ${MODE} @ ${STAMP}" || echo "nothing to commit"
          git push origin master 2>&1 | tail -5 || echo "push failed"
          echo "DONE"
